name: Release

on:
  push:
    tags:
      - "v*"

# Stated explicitly rather than relying on the repository default, so the
# permissions a workflow runs with are readable here.
permissions:
  contents: read
  # Declared at workflow level rather than on the job. A job-level grant does
  # not elevate when the repository default is read; a workflow-level one does.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test Its.Compiler.sln --configuration Release

      - name: Pack
        run: dotnet pack src/Its.Compiler/Its.Compiler.csproj --configuration Release --output packages

      # The issued key lasts an hour, so it is requested immediately before the
      # push rather than at the top of the job.
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        run: >
          dotnet nuget push "packages/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
