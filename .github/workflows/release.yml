name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets GitHub mint the OIDC token that nuget.org exchanges for a
      # short-lived API key. Without it the login step has nothing to present.
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test Its.Compiler.sln --configuration Release

      - name: Pack
        run: dotnet pack src/Its.Compiler/Its.Compiler.csproj --configuration Release --output packages

      # The issued key lasts an hour, so it is requested immediately before the
      # push rather than at the top of the job.
      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        run: >
          dotnet nuget push "packages/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
