name: CI

on:
  push:
    branches: [main]
  pull_request:

# Stated explicitly rather than relying on the repository default, so the
# permissions a workflow runs with are readable here.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build Its.Compiler.sln --configuration Release

      - name: Test
        run: dotnet test Its.Compiler.sln --configuration Release --no-build
